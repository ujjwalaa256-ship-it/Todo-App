<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-100">

    <div class=" bg-white max-w-md mx-auto  m-10 rounded-lg ">

        <div class="bg-indigo-600 p-5 rounded-t-xl">
            <h1 class="text-white font-bold text-2xl">Todo App</h1>
        </div>

        <div class="p-5">
            <form action="" class="flex gap-5" id="form">

                <input id="todoinput" class="flex-1 border border-gray-400 p-1 rounded-md" type="text"
                    placeholder="Enter task description...">
                <button id="form-btn" class="bg-indigo-600 px-4 py-2 rounded-md text-white font-bold text-sm"> Add</button>

                
                    <button type="button" id="cancel-btn" class="hidden  text-xs text-slate-500 hover:text-slate-700 underline cursor-pointer ">Cancel Editing</button>
                


            </form>

            <div class="flex justify-between pt-4 pb-1 text-sm border-b border-gray-500  text-gray-600">
                <p id="task-count">TASKS(0)</p>

                <p id="complete-count">COMPLETED:0</p>
            </div>

            

            <ul class="py-5 flex flex-col gap-3 " id="todolist">
                <!-- <li data-id="1" class="flex gap-2 border border-gray-300 rounded-lg py-2 px-3">
                    <input data-id="1" type="checkbox">
                    <p class="flex-1">Go to gym</p>
                    <div class="flex gap-2">
                        <button data-id="1" class="bg-yellow-50  rounded-md text-yellow-500 px-2 font-semibold">Edit</button>
                        <button data-id="1" class="bg-red-50 rounded-md text-red-600 px-2 py-0.5 font-semibold">Delete</button> 
                    </div>
                </li> -->
            </ul>

            <div id="empty-state" class="hidden text-center py-8 text-slate-400">
                <p class="text-sm">No tasks found. Add a task above to get started!</p>
            </div>
            

        </div>

    </div>
    <script src="index.js"></script>
</body>

</html>
